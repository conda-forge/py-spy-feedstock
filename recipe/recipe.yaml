schema_version: 1

context:
  name: py-spy
  pypi_name: py_spy
  version: "0.4.3"

package:
  name: py-spy
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ pypi_name }}-${{ version }}.tar.gz
  sha256: 65ac4319f8c20dcd1e2ea219935c6b4fd98179b0b7faf59181eae2680a85fad4

build:
  number: 0
  dynamic_linking:
    missing_dso_allowlist:
      - if: osx
        then: /usr/lib/libresolv.9.dylib

requirements:
  build:
    - ${{ stdlib("c") }}
    - ${{ compiler('c') }}
    - ${{ compiler('rust') }}
    - cargo-bundle-licenses
  host:
    - if: linux
      then:
        - libunwind
        - liblzma-devel

tests:
  - script:
      - py-spy --help

about:
  license: MIT
  summary: Sampling profiler for Python programs
  license_file:
    - LICENSE
    - THIRDPARTY.yml
  homepage: https://github.com/benfred/py-spy

extra:
  recipe-maintainers:
    - benfred
    - xhochy
